<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rules</title>
    <link rel="stylesheet" href="../src/style.css" />
    <link rel="icon" href="/img/admin.png" />
    <script type="module" src="/src/page-theme.js"></script>
    <script type="module" src="/src/page-shell.js"></script>
  </head>
  <body>
    <div class="page-board">
      <div id="page-header"></div>


      <div class="thread">
        <div class="post op" id="rules">
          <blockquote class="postMessage">
            <section class="rules-panel" aria-label="Global rules">
              <h2 class="rules-panel-title">Global Rules</h2>
              <div class="rules-panel-body">
                <ol class="rules-list">
                  <li>(You) WILL not upload, post, discuss, request, or link to anything that violates local or United States law.</li>
                  <li>(You) WILL not use the website if you are <a href="https://www.youtube.com/watch?v=tKf97RlcHss" target="_blank" rel="noopener noreferrer">under the age of 18</a>.</li>
                  <li>Keep content on-topic.</li>
                  <li>No illegal content.</li>
                </ol>
              </div>
            </section>
          </blockquote>
        </div>
      </div>

      <div id="page-footer"></div>
    </div>
  </body>
</html>
