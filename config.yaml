# ==============================================================================
# gschan - Imageboard / Comment Widget Configuration
# ==============================================================================
# This configuration file controls the backend connection, board identity,
# posting rules, appearance, moderation, and UI text for your board.
#
# Tip: Quote all Google entry IDs and sheet/form IDs as strings (e.g. "123456").
# ==============================================================================

# ==============================================================================
# 1. Google Forms & Sheets Backend
# ==============================================================================
# gschan uses Google Forms as a submission API and a linked Google Sheet as its
# public database. Comments are fetched directly from the sheet's public visualization feed.

# The Google Form ID.
# Found in your Google Form URL: https://docs.google.com/forms/d/e/<formId>/viewform
formId: ""

# The Google Sheet ID linked to the Google Form responses.
# Found in your Google Sheet URL: https://docs.google.com/spreadsheets/d/<sheetId>/edit
# Ensure the Google Sheet is shared as "Anyone with the link can view".
sheetId: ""

# Google Form Entry IDs (entry.XXXXX).
# To find these IDs, open your Google Form in a browser, click the three dots ->
# "Get pre-filled link", fill dummy data, click "Get link", and inspect the URL query params.
nameId: "" # Text field for poster's name / tripcode
subjectId: "" # Text field for the optional post subject
textId: "" # Textarea field for comment content
pageId: "" # Hidden field storing page path (for multi-page / threads)
replyId: "" # Hidden field storing parent post number when replying
imageId: "" # Hidden field storing image/media URLs [url1][url2]

# ==============================================================================
# 2. Board Identity & Branding
# ==============================================================================
# Titles and subtitles shown on the board header and across site pages.

widgetTitle: "gschan"
widgetBannerTitle: "/gs/ - gschan"
widgetBannerSubtitle: "Google Sheets & Forms Powered Imageboard Engine"

# ==============================================================================
# 3. Posting Rules & Behavior
# ==============================================================================
# Global toggles and limits for user submissions.

# Open or temporarily close the board for new comments/threads.
commentsOpen: true

# If false, users MUST attach at least one image or video embed to create a new thread.
# Replies to existing threads do not require an embed.
allowPostWithoutEmbed: true

# Error message displayed when a user tries to start a thread without media.
embedRequiredText: "An embed is required to start a new thread."

# Maximum character count for comment text.
maxLength: 500

# Maximum character count for user name.
maxLengthName: 16

# Collapse thread replies behind an "expand" toggle by default.
collapsedReplies: false

# ==============================================================================
# 4. Appearance & Themes
# ==============================================================================
# Theme styles and pagination controls.

# Default board theme.
# Options:
#   - "yotsuba"   : Classic Futaba / 4chan light red/peach theme
#   - "yotsubab"  : Classic 4chan light blue theme (SFW boards)
#   - "futaba"    : Retro Futaba Channel style
#   - "burichan"  : Classic Burichan blue theme
#   - "tomorrow"  : Dark grey / modern dark theme
#   - "photon"    : Minimalist light blue theme
#   - "spooky"    : Halloween dark orange / black theme
defaultTheme: "yotsuba"

# Number of top-level threads/comments displayed per page.
commentsPerPage: 5

# Show full timestamp (e.g. "January 1, 2026 12:00:00 AM") instead of compact (e.g. "01/01/26(Thu)12:00:00").
longTimestamp: false

# ==============================================================================
# 5. Content Filtering & Moderation
# ==============================================================================
# Client-side word filter applied when comments are rendered.

# Enable or disable the word filter.
wordFilterOn: false

# Replacement text inserted in place of filtered words.
filterReplacement: "**CENSORED**"

# List of words or phrases to filter (case-insensitive word-boundary matching).
filteredWords: []

# ==============================================================================
# 6. Tripcode Roles & Badges
# ==============================================================================
# Maps tripcode hashes (from Name#secret input) to administrative badges.
# Format: '!<HASH>': 'BADGE_NAME'
# Example: '!EXAMPLE_TRIP': 'ADMIN' renders as: Name ◆ ADMIN
tripcodeLabels: {}

# ==============================================================================
# 7. UI Labels & Localization
# ==============================================================================
# Custom text strings used throughout the comment widget interface.

# Form field labels
nameFieldLabel: "Name"
subjectFieldLabel: "Subject"
imageFieldLabel: "Image URL"
textFieldLabel: "" # If empty, defaults to "Comment"
submitButtonLabel: "Submit"

# Status & banner messages
loadingText: "Loading comments..."
noCommentsText: "No comments yet!"
closedCommentsText: "Comments are closed temporarily!"

# Interaction buttons & indicators
replyButtonText: "Reply"
replyingText: "Replying to"
expandRepliesText: "Show Replies"
leftButtonText: "<<"
rightButtonText: ">>"
themeLabelText: "Theme"

# ==============================================================================
# 8. Advanced & Compatibility Settings
# ==============================================================================

# Include URL query parameters in page identification.
# If true, "?page=1" and "?page=2" have distinct comment threads.
includeUrlParameters: false

# Compatibility fix for Rarebit webcomic engine where home page is "?pg=1".
fixRarebitIndexPage: false
